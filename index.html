<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdminExpress | Sign In</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-page">

    <!-- Columna izquierda -->
    <section class="brand-panel" aria-label="AdminExpress">
      <h1>AdminExpress</h1>
    </section>

    <!-- Columna derecha -->
    <section class="form-panel" aria-labelledby="login-title">
      <div class="login-box">
        <h2 id="login-title">
          Let’s <strong>Sign In</strong>
          <span aria-hidden="true">👇</span>
        </h2>

        <p class="description">
          Hey, Enter your details to get sign in<br>
          to your account.
        </p>

        <form id="login-form">

          <!-- Campo de correo -->
          <div class="field-group">
            <label for="email">Email</label>

            <div class="input-wrapper">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="m3 6 9 7 9-7" />
              </svg>

              <input
                id="email"
                type="email"
                placeholder="Enter Email"
                autocomplete="username"
                required
              >
            </div>
          </div>

          <!-- Campo de contraseña -->
          <div class="field-group">
            <label for="password">Password</label>

            <div class="input-wrapper password-wrapper">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="10" width="14" height="11" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>

              <input
                id="password"
                type="password"
                placeholder="Enter Password"
                autocomplete="current-password"
                required
              >

              <button
                class="eye-button"
                id="toggle-password"
                type="button"
                aria-label="Mostrar contraseña"
                aria-pressed="false"
              >
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <details class="recovery">
            <summary>Forgot password?</summary>
            <p>Demo only. Password recovery is not connected.</p>
          </details>

          <button class="sign-in-button" type="submit">
            Sign In
          </button>

          <p class="form-message" id="form-message" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <!-- Interacciones opcionales de la maqueta -->
  <script>
    const password = document.getElementById("password");
    const toggle = document.getElementById("toggle-password");

    toggle.addEventListener("click", () => {
      const visible = password.type === "password";

      password.type = visible ? "text" : "password";

      toggle.setAttribute("aria-pressed", String(visible));
      toggle.setAttribute(
        "aria-label",
        visible ? "Ocultar contraseña" : "Mostrar contraseña"
      );
    });

    document.getElementById("login-form").addEventListener("submit", (event) => {
      event.preventDefault();

      document.getElementById("form-message").textContent =
        "Demo: formulario validado. No se enviaron credenciales.";
    });
  </script>
</body>
</html>
